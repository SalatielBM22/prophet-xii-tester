[package]
name = "prophet-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared host adapter runtime, EnginePort v1 wire codec, command/music scheduling, off-thread preparation, bounded VCF analysis, and embedded GUI shell for PROPHET-XII"

[dependencies]
prophet-control = { path = "../prophet-control" }
prophet-dsp = { path = "../prophet-dsp" }
prophet-params = { path = "../prophet-params" }
prophet-analysis-core = { path = "../prophet-analysis-core" }
rtrb = "0.3.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
libc = "0.2"

# Microsoft Edge WebView2 hosting for the embedded React UI (standalone window and
# VST3/CLAP editors). Windows only, so Linux/Android never pull webkit2gtk or tao.
[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "=0.57.3", default-features = false }
