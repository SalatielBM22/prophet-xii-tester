[package]
name="prophet-android"
version.workspace=true
edition.workspace=true
license.workspace=true
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
prophet-host = { path = "../prophet-host" }
prophet-dsp = { path = "../prophet-dsp" }
prophet-control = { path = "../prophet-control" }
prophet-params = { path = "../prophet-params" }
prophet-analysis-core = { path = "../prophet-analysis-core" }
rtrb = "0.3.6"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[target.'cfg(target_os="android")'.dependencies]
jni = "0.21.1"
libc = "0.2"
