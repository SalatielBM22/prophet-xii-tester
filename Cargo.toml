[workspace]
resolver = "2"
members = [
    "crates/prophet-dsp",
    "crates/prophet-control",
    "crates/prophet-params",
    "crates/prophet-render",
    "crates/prophet-standalone",
    "crates/prophet-plugin",
    "crates/prophet-android",
    "crates/prophet-analysis-core",
]
exclude = [
    "crates/prophet-analysis",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["PROPHET-XII DSP Engineering Team"]


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = false
